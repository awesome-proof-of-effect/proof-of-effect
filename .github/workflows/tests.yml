name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the tools the integration tests drive
        run: |
          python -m pip install pytest==8.3.3 ruff==0.7.1 pyyaml==6.0.2 tomli==2.0.1
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund typescript@5.6.3 eslint@9.13.0 jest@29.7.0
      - name: Run the tests
        env:
          POE_TEST_TOOLPATH: ${{ runner.temp }}/tools/node_modules/.bin
        run: python -m pytest tests -q -rs
